services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bekbekei
      POSTGRES_USER: bekbekei
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bekbekei -d bekbekei"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: postgres://bekbekei:${POSTGRES_PASSWORD}@db:5432/bekbekei
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "node dist/scripts/migrate.js && node dist/server.js"]
volumes:
  pgdata:
